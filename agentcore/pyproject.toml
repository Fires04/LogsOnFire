[project]
name = "logsonfire-agentcore"
version = "0.1.0"
description = "Local log-file/journal reading logic shared by the LogsOnFire agent — zero FastAPI/SQLAlchemy dependency, safe to install on a monitored host."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["logsonfire_agentcore*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
