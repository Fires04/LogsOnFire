[project]
name = "logsonfire"
version = "0.1.0"
description = "LogsOnFire - web app for viewing local and remote (SSH) logs, live"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "passlib[argon2]>=1.7",
    "pyjwt>=2.8",
    "asyncssh>=2.14",
    # asyncssh needs this to decrypt modern (bcrypt-KDF) passphrase-encrypted
    # OpenSSH private keys — the default `ssh-keygen` output format since
    # OpenSSH 6.5. Without it, importing such a key raises KeyEncryptionError.
    "bcrypt>=4.0",
    "cryptography>=42",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
