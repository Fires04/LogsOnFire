[project]
name = "logsonfire"
version = "0.1.0"
description = "LogsOnFire - web app for live-tailing logs pushed by agents installed on monitored hosts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "passlib[argon2]>=1.7",
    "pyjwt>=2.8",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    # fireauth.oidc (optional Authentik/OIDC login bolted onto our own
    # JWT/RBAC auth, never a replacement for it — see
    # backend/app/api/routes/auth.py) and fireauth.auth_log (shared
    # cross-app stdout login-attempt logging convention) are used.
    # fireauth.session/fireauth.router (the password/cookie-session
    # pieces) are deliberately not used: this app's own
    # User/Role/Permission/ResourceGrant RBAC is more capable than
    # FireAuth's single-tier session model, same reasoning CrowdOnFire
    # applied to its own bespoke auth.
    "fireauth[oidc] @ git+https://github.com/Fires04/FireAuth.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
